# Overrides for Synthea v4.0.0, loaded with -c. Everything not set here keeps
# the jar's default. Run from the repository root (paths are relative to it):
#
#   synthea/run_synthea.sh      (or run_synthea.ps1 on Windows)
#
# WHY THESE OVERRIDES. Synthea's default payer file names six real insurers and
# its default provider files are real facilities with real NPIs. This repo
# must name no company and carry no real identifier, so every payer and
# provider file points at the generic or fictitious files beside this one.
# tests/test_synthea_sample.py scans the committed sample for the default
# names and must find none; its positive control scans the jar's own files
# and must find them.

exporter.baseDirectory = ./synthea/output/
exporter.years_of_history = 3
exporter.fhir.export = false
exporter.hospital.fhir.export = false
exporter.practitioner.fhir.export = false
exporter.csv.export = true
exporter.csv.folder_per_run = false
exporter.csv.included_files = patients.csv,payer_transitions.csv,payers.csv,encounters.csv

# Generic payers (no insurer named) and fictitious New Jersey facilities.
generate.payers.insurance_companies.default_file = config/synthea/payers/insurance_companies.csv
generate.payers.insurance_plans.default_file = config/synthea/payers/insurance_plans.csv
generate.providers.hospitals.default_file = config/synthea/providers/hospitals.csv
generate.providers.longterm.default_file = config/synthea/providers/nursing.csv
generate.providers.nursing.default_file = config/synthea/providers/nursing.csv
generate.providers.rehab.default_file = config/synthea/providers/hospitals.csv
generate.providers.hospice.default_file = config/synthea/providers/hospitals.csv
generate.providers.dialysis.default_file = config/synthea/providers/hospitals.csv
generate.providers.homehealth.default_file = config/synthea/providers/hospitals.csv
generate.providers.veterans.default_file = config/synthea/providers/hospitals.csv
generate.providers.urgentcare.default_file = config/synthea/providers/primary_care.csv
generate.providers.primarycare.default_file = config/synthea/providers/primary_care.csv
generate.providers.ihs.hospitals.default_file = config/synthea/providers/hospitals.csv
generate.providers.ihs.primarycare.default_file = config/synthea/providers/primary_care.csv
generate.providers.default_to_hospital_on_failure = true
generate.providers.maximum_search_distance = 1000
